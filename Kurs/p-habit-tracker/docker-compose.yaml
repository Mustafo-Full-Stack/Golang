# ============================================================================
# ФАЙЛ: docker-compose.yaml
# НАЗНАЧЕНИЕ: Запускает одной командой сразу всю систему: Базу данных PostgreSQL (`db`)
#             и наше Go-приложение (`app`).
# ============================================================================
#
# 🧒 ОБЪЯСНЕНИЕ ДЛЯ 10-ЛЕТНЕГО РЕБЁНКА:
#   Если `Dockerfile` — это чертёж одного кубика, то `docker-compose.yaml` — это дирижёр оркестра!
#   Он поднимает два контейнера (`db` и `app`), соединяет их виртуальным проводом,
#   сам запускает SQL-файлы из папки `migrations/` и ждёт, пока база проснётся (`healthcheck`),
#   прежде чем включать наше Go-приложение!
#
# 🍕 ПРИМЕРЫ НА РЕСТОРАНЕ (2 НАГЛЯДНЫХ ПРИМЕРА):
#   ПРИМЕР 1: Склад (`db`) и Зал ресторана (`app`) открываются по очереди (`depends_on` + `healthcheck`)
#     Если открыть двери зала для гостей в ту же секунду, когда кладовщик только поворачивает ключ
#     в замке склада, первые заказы упадут с ошибкой.
#     Поэтому блок `healthcheck` каждые 5 секунд спрашивает склад: `pg_isready` ("Склад готов?"),
#     а блок `depends_on: condition: service_healthy` держит двери ресторана `app` закрытыми,
#     пока склад `db` не ответит: "Я полностью готов к работе!".
#
#   ПРИМЕР 2: Несгораемый сейф данных (`volumes: pgdata`)
#     Если вечером выключить контейнеры, без `volumes` все записи в базе исчезли бы.
#     Том `pgdata:/var/lib/postgresql/data` — это постоянный жёсткий диск (сейф),
#     где все пользователи и привычки сохраняются даже после перезагрузки компьютера!
# ============================================================================

# Разбор строки: `services:` — список контейнеров (сервисов), которые нужно запустить.
services:
  # --------------------------------------------------------------------------
  # Сервис 1: База данных PostgreSQL (`db`)
  # --------------------------------------------------------------------------
  db:
    # Готовый официальный образ PostgreSQL версии 17 на базе лёгкого Linux Alpine.
    image: postgres:17-alpine
    # Переменные окружения для создания базы (берутся из `.env`, а после `:-` указано значение по умолчанию).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-habits}
    # Пробрасываем порт базы на наш компьютер (`127.0.0.1:5432 -> 5432`), чтобы подключаться к ней локально.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    # Подключаем постоянное хранилище `pgdata` и папку `./migrations` (PostgreSQL сам выполнит все `.sql` при первом старте!).
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    # Проверка здоровья базы данных: утилита `pg_isready` проверяет, готова ли БД принимать запросы.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # --------------------------------------------------------------------------
  # Сервис 2: Наше Go-приложение (`app`)
  # --------------------------------------------------------------------------
  app:
    # Собираем образ из `Dockerfile` в текущей папке (`.`).
    build: .
    # Загружаем секреты и настройки из файла `.env`.
    env_file: .env
    # Внутри сети Docker база данных доступна по имени сервиса `db` (вместо `localhost`).
    environment:
      POSTGRES_HOST: db
    # Пробрасываем порт `8080` наружу (`http://localhost:8080`).
    ports:
      - "8080:8080"
    # Запускаем `app` ТОЛЬКО после того, как `db` успешно прошла проверку `healthcheck` (`service_healthy`).
    depends_on:
      db:
        condition: service_healthy

# Объявляем постоянный том `pgdata` для хранения файлов базы данных.
volumes:
  pgdata:
