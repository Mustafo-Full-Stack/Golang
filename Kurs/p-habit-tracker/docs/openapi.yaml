# ============================================================================
# ФАЙЛ: docs/openapi.yaml
# ЗАЧЕМ НУЖЕН: Спецификация нашего REST API по стандарту OpenAPI 3.0.3
# (для Swagger UI, Swagger Editor или импорта в Postman).
#
# Обновлено под актуальную версию из `habit-tracker`:
#   - `POST /login` возвращает пару токенов: `access_token` и `refresh_token`;
#   - для доступа к `/habits...` принимается только `access_token` (`refresh_token` вернёт 401);
#   - `GET /habits` и `GET /habits/{id}/checks` поддерживают пагинацию `limit`/`offset`
#     и возвращают объект `{items, limit, offset, total}` (`HabitList` и `HabitCheckList`);
#   - примеры ошибок приведены к реальным ответам сервера на английском языке.
# ============================================================================

openapi: 3.0.3
info:
  title: habit-tracker
  version: 1.0.0
  description: |
    API трекера привычек: регистрация, логин, создание привычек и отметки их ежедневного выполнения.

    Аутентификация через JWT: после `/login` передавайте `access_token`
    в заголовке `Authorization: Bearer <token>`. Токены на сервере не хранятся,
    поэтому отдельной ручки logout нет — клиент просто удаляет токен у себя.
servers:
  - url: http://localhost:8080
tags:
  - name: auth
    description: Аутентификация
  - name: habits
    description: Привычки и отметки выполнения. Все ручки требуют Bearer-токен из /login.

paths:
  /sign-up:
    post:
      tags: [auth]
      summary: Регистрация пользователя
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '400':
          description: Невалидное тело запроса, пустые поля или пароль не подходит по длине
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value: { error: invalid request body }
                invalidInput:
                  value: { error: invalid input }
                passwordTooShort:
                  value: { error: password too short }
                passwordTooLong:
                  value: { error: password too long }
        '409':
          description: Пользователь с таким email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: user already exists }
        '500':
          $ref: '#/components/responses/InternalError'

  /login:
    post:
      tags: [auth]
      summary: Логин
      description: |
        Возвращает пару JWT, подписанных HS256:
        - `access_token` — для заголовка `Authorization: Bearer <token>`, живёт `ACCESS_TOKEN_TTL` (по умолчанию 15 минут);
        - `refresh_token` — живёт `REFRESH_TOKEN_TTL` (по умолчанию 30 дней). Вместо access не принимается.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный логин
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Невалидное тело запроса или пустые поля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value: { error: invalid request body }
                invalidInput:
                  value: { error: invalid input }
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: invalid email or password }
        '500':
          $ref: '#/components/responses/InternalError'

  /habits:
    post:
      tags: [habits]
      summary: Создание привычки
      description: |
        Создаёт новую привычку для текущего пользователя (из JWT-токена).
        Пробелы по краям `name` обрезаются, максимальная длина — 100 символов.
      operationId: createHabit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHabitRequest'
      responses:
        '201':
          description: Привычка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          description: Невалидное тело запроса или название привычки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value: { error: invalid request body }
                invalidInput:
                  value: { error: invalid input }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [habits]
      summary: Список привычек пользователя
      description: Возвращает страницу привычек текущего пользователя, отсортированных по `id`.
      operationId: listHabits
      security:
        - bearerAuth: []
      # Необязательные query-параметры пагинации (?limit=20&offset=0)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Список привычек с параметрами пагинации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitList'
        '400':
          description: Некорректные параметры `limit` или `offset`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidLimit:
                  value: { error: invalid limit }
                limitOutOfRange:
                  value: { error: 'invalid input: limit must be between 1 and 100' }
                offsetNegative:
                  value: { error: 'invalid input: offset must be zero or greater' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /habits/{id}/check:
    post:
      tags: [habits]
      summary: Отметить привычку выполненной за сегодня
      description: |
        Создаёт отметку выполнения привычки за текущую дату (по UTC).
        Отметить можно только свою привычку и не более одного раза в день.
      operationId: checkHabit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HabitID'
      responses:
        '201':
          description: Привычка отмечена выполненной
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckHabitResponse'
        '400':
          description: Некорректный ID привычки в URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: invalid habit ID }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Привычка уже отмечена сегодня
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: habit already checked today }
        '500':
          $ref: '#/components/responses/InternalError'

  /habits/{id}/checks:
    get:
      tags: [habits]
      summary: История отметок привычки
      description: Возвращает страницу дат выполнения указанной привычки, отсортированных по возрастанию даты.
      operationId: listChecks
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HabitID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Список дат выполнения с параметрами пагинации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitCheckList'
        '400':
          description: Некорректный ID привычки в URL или некорректные `limit`/`offset`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidID:
                  value: { error: invalid habit ID }
                invalidLimit:
                  value: { error: invalid limit }
                limitOutOfRange:
                  value: { error: 'invalid input: limit must be between 1 and 100' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    HabitID:
      name: id
      in: path
      required: true
      description: ID привычки
      schema:
        type: integer
        format: int64
        example: 1
    # Параметры пагинации в query-строке URL (?limit=20&offset=0)
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы. По умолчанию 20, от 1 до 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Сколько записей пропустить с начала. По умолчанию 0.
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    Unauthorized:
      description: Токен не передан, невалиден, просрочен или это refresh-токен вместо access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingHeader:
              value: { error: missing or invalid authorization header }
            invalidToken:
              value: { error: invalid or missing token }

    Forbidden:
      description: Привычка принадлежит другому пользователю
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: forbidden }

    NotFound:
      description: Привычка не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: not found }

    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: internal server error }

  schemas:
    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          description: Пробелы по краям обрезаются, пустое имя не принимается.
          example: Mustafo
        email:
          type: string
          format: email
          description: Пробелы обрезаются, приводится к нижнему регистру.
          example: mustafo@mail.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: От 8 до 72 байт (ограничение bcrypt).
          example: secret123

    SignUpResponse:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          example: 1

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: mustafo@mail.com
        password:
          type: string
          format: password
          example: secret123

    # Схема ответа при логине: теперь возвращаются сразу два токена — access_token и refresh_token
    LoginResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
          description: 'JWT с полями `user_id`, `type: access`, `iat`, `exp`.'
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: 'JWT с полями `user_id`, `type: refresh`, `iat`, `exp`.'
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    CreateHabitRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: От 1 до 100 символов после обрезки пробелов.
          example: Читать 30 минут в день

    Habit:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Читать 30 минут в день
        created_at:
          type: string
          format: date-time
          example: '2026-11-15T12:00:00Z'

    # Страница привычек с метаданными пагинации (соответствует listResponse[habitResponse])
    HabitList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Habit'
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        total:
          type: integer
          format: int64
          example: 15

    CheckHabitResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: checked

    HabitCheck:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
          description: Дата выполнения в формате YYYY-MM-DD (UTC).
          example: '2026-11-15'

    # Страница отметок привычки с метаданными пагинации (соответствует listResponse[checkResponse])
    HabitCheckList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HabitCheck'
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        total:
          type: integer
          format: int64
          example: 15

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
